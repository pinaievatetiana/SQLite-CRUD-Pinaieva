<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Редагувати фільм</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #121212; color: #e0e0e0; }
        h1 { color: #ffffff; }
        form { background: #1e1e1e; padding: 20px; width: 400px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.5); border: 1px solid #333333; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #e0e0e0; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #444; border-radius: 4px; background: #2a2a2a; color: #fff; }
        button { margin-top: 15px; padding: 10px 15px; background: #ffc107; color: black; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        a { display: inline-block; margin-top: 15px; text-decoration: none; color: #4CAF50; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Редагувати фільм</h1>
    <form method="POST">
        <label>Назва фільму:</label>
        <input type="text" name="title" value="{{ movie[1] }}" required>
        
        <label>Жанр:</label>
        <input type="text" name="genre" value="{{ movie[2] }}" required>
        
        <label>Рік виходу:</label>
        <input type="number" name="release_year" value="{{ movie[3] }}">
        
        <label>Режисер:</label>
        <input type="text" name="director" value="{{ movie[4] }}">
        
        <label>Рейтинг:</label>
        <input type="number" step="0.1" name="rating" value="{{ movie[5] }}">
        
        <button type="submit">Оновити</button>
    </form>
    <a href="/">&larr; Назад до каталогу</a>
</body>
</html>
